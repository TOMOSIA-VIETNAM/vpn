name: release

# Publishes a release only for a pushed semver tag (vX.Y.Z), and only after
# the test workflow passes on that exact commit. One macOS job builds
# everything — the Go CLI cross-compiles for both architectures anywhere,
# but "TOMOSIA VPN.app" needs Apple's Swift toolchain — so the manifest below can
# cover every asset in a single place.
#
# Each release carries vpn-darwin-arm64, vpn-darwin-amd64, TOMOSIA-VPN.app.zip,
# TOMOSIA-VPN.dmg, plus SHA256SUMS and its ed25519 signature SHA256SUMS.sig (see
# internal/release). `vpn update` refuses a release whose signature does not
# verify against the key compiled into the installed binary. install.sh checks
# a second signature of SHA256SUMS, SHA256SUMS.p256.sig, with the system openssl.
#
# Requires the RELEASE_SIGNING_KEY secret: base64 ed25519 seed from
# `go run ./cmd/releasesign keygen`, matching release.PublicKey; and the
# INSTALL_SIGNING_KEY secret from `go run ./cmd/releasesign keygen-p256`,
# matching INSTALL_PUBKEY in install.sh.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: macos-latest
    # Holds the signing secrets: give the "release" environment required
    # reviewers and a tag rule in the repository settings so a pushed tag alone
    # cannot sign and publish (see CONTRIBUTING.md, "Releasing").
    environment: release
    permissions:
      contents: write
    steps:
      # Third-party code is pinned by commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Build CLI
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "vpn-darwin-$arch" ./cmd/vpn
          done

      # Optional Developer ID signing and notarization (see CONTRIBUTING.md,
      # "Developer ID and notarization"). Every step below that mentions it is
      # skipped until the MACOS_CERT_P12 secret exists; the app is then ad-hoc
      # signed exactly as before.
      - name: Detect Developer ID credentials
        id: devid
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
        run: if [ -n "$CERT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Import the Developer ID certificate
        if: steps.devid.outputs.present == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          echo "CODESIGN_IDENTITY=$MACOS_CERT_IDENTITY" >> "$GITHUB_ENV"

      # build.sh signs with $CODESIGN_IDENTITY when the step above set it.
      - name: Build TOMOSIA VPN.app (universal — arm64 + Intel)
        run: VERSION="${GITHUB_REF_NAME#v}" bash build.sh

      - name: Test the app logic
        run: bash test-app.sh

      - name: Notarize the app
        if: steps.devid.outputs.present == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "build/TOMOSIA VPN.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "build/TOMOSIA VPN.app"

      # ditto (not plain zip) preserves the bundle's resource forks/extended
      # attributes correctly — Apple's own documented way to zip an .app.
      - name: Zip the app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/TOMOSIA VPN.app" TOMOSIA-VPN.app.zip

      # Drag-to-Applications disk image for people who don't use the install script.
      # The app inside carries the CLI and installs it on first launch.
      - name: Build TOMOSIA-VPN.dmg
        run: bash make-dmg.sh && cp build/TOMOSIA-VPN.dmg TOMOSIA-VPN.dmg

      - name: Sign and notarize the disk image
        if: steps.devid.outputs.present == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" TOMOSIA-VPN.dmg
          xcrun notarytool submit TOMOSIA-VPN.dmg --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple TOMOSIA-VPN.dmg

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          # Signs SHA256SUMS a second time, with a key openssl can verify:
          # install.sh refuses a release without it (see CONTRIBUTING.md).
          INSTALL_SIGNING_KEY: ${{ secrets.INSTALL_SIGNING_KEY }}
        run: |
          go run ./cmd/releasesign sign -version "$GITHUB_REF_NAME" -out . \
            vpn-darwin-arm64 vpn-darwin-amd64 TOMOSIA-VPN.app.zip TOMOSIA-VPN.dmg

      # gh is preinstalled on GitHub runners — no third-party release action.
      # Immutable releases only accept assets while draft, so upload into a
      # draft first, then publish it as latest.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s SHA256SUMS.p256.sig ] || { echo "error: SHA256SUMS.p256.sig is missing (is INSTALL_SIGNING_KEY set?): install.sh would refuse this release" >&2; exit 1; }
          assets=(vpn-darwin-arm64 vpn-darwin-amd64 TOMOSIA-VPN.app.zip TOMOSIA-VPN.dmg SHA256SUMS SHA256SUMS.sig SHA256SUMS.p256.sig)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Built from ${GITHUB_SHA}. SHA256SUMS is signed with ed25519 (SHA256SUMS.sig)."
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
