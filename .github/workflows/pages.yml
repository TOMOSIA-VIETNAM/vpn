name: pages

# Publishes the landing page in docs/ to GitHub Pages. Enable it once under
# Settings → Pages → Source: "GitHub Actions".
#
# The custom domain is NOT kept in the repo: set or change it under
# Settings → Pages → Custom domain, no release or commit needed. With none set,
# the site is served at https://<org>.github.io/<repo>/. The canonical / og: URLs
# in index.html are filled in below from whatever address Pages reports, so re-run
# this workflow (Actions → pages → Run workflow) after changing the domain to
# refresh them; the site itself works either way.
on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Third-party code is pinned by commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Fill in the site URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: sed -i "s|__SITE_URL__|${SITE_URL%/}|g" docs/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
