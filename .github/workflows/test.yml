name: test

# Gate for every change: formatting, vet, the full test suite and an app
# build. Runs on macOS because the tree includes darwin-only packages (utun,
# routing), and is reused by release.yml so nothing is published without
# passing it.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      # Third-party code is pinned by commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # The menu bar app only compiles with Xcode 26 / Swift 6, which developer
  # machines may not have — so build it here on every change, catching
  # Swift errors before a release does, and attach the result so a PR's UI
  # changes can be tried without a local toolchain.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Also compiles the CLI that build.sh bundles into the app.
      - name: Build TMS VPN.app
        run: bash build.sh

      - name: Build TMS-VPN.dmg
        run: bash make-dmg.sh

      - name: Zip the app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/TMS VPN.app" TMS-VPN.app.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TMS-VPN-app
          path: TMS-VPN.app.zip
          retention-days: 7
